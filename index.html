const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let view='shops',q={s:'',cat:'',ward:'',sort:'rating'};
const shop=id=>db.shops.find(s=>s.id==id);
const adr=s=>s.addr&&s.ward&&s.addr.includes(s.ward)?s.addr:[s.addr,s.ward].filter((v,i,a)=>v&&a.indexOf(v)===i).join(', ');
const zl=s=>{let n=String(s.zalo||s.phone||'').replace(/\D/g,'');if(n.startsWith('0'))n='84'+n.slice(1);return n};const zUrl=s=>'https://zalo.me/'+zl(s);
const dataCats=()=>{const m={};(view==='shops'?db.shops:db.products).forEach(x=>{if(x.cat)m[x.cat]=(m[x.cat]||0)+1});return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'vi'))};
const catList=()=>[...new Set([...Object.keys(CATS),...db.shops.map(s=>s.cat),...db.products.map(p=>p.cat)].filter(Boolean))];
const wards=()=>[...new Set(db.shops.map(s=>s.ward).filter(Boolean))].sort();
const toast=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2a22;color:#fff;padding:10px 18px;border-radius:12px;z-index:99';document.body.appendChild(t);setTimeout(()=>t.remove(),2500)};
const ask=(m,fn)=>{const d=$('#dlg');d.innerHTML=`<p>${esc(m)}</p><div class="row"><button class="btn" id="yes">Đồng ý</button><button class="btn s" onclick="dlg.close()">Hủy</button></div>`;d.showModal();$('#yes').onclick=()=>{d.close();fn()}};
function bar(kind){return `<div class="bar"><div class="led"><input id="qs" placeholder="🔍 Tìm ${kind==='shops'?'hộ kinh doanh, chủ hộ, địa chỉ, mặt hàng đang bán':'mặt hàng, cửa hàng'}..." value="${esc(q.s)}"></div>
<select id="qc"><option value="">Tất cả ngành hàng</option>${dataCats().map(([c,n])=>`<option value="${esc(c)}" ${q.cat==c?'selected':''}>${esc(c)} (${n})</option>`).join('')}</select>${kind==='shops'?`<select id="qw"><option value="">Tất cả khu vực</option>${wards().map(w=>`<option ${q.ward==w?'selected':''}>${esc(w)}</option>`).join('')}</select>`:''}
<select id="qo">${kind==='shops'?`<option value="rating">Đánh giá cao</option><option value="name">Tên A-Z</option>`:`<option value="name">Tên A-Z</option><option value="pa">Giá tăng dần</option><option value="pd">Giá giảm dần</option>`}</select></div>
<div class="chips"><button class="chip ${!q.cat?'on':''}" data-c="">Tất cả</button>${dataCats().map(([c,n])=>`<button class="chip ${q.cat==c?'on':''}" data-c="${esc(c)}">${CATS[c]||'🏷️'} ${esc(c)} (${n})</button>`).join('')}</div>`}
function bind(){const i=$('#qs');if(i){i.oninput=()=>{q.s=i.value;list()};}
const w=$('#qw');if(w)w.onchange=()=>{q.ward=w.value;list()};
const o=$('#qo');if(o){o.value=q.sort;o.onchange=()=>{q.sort=o.value;list()}}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{q.cat=b.dataset.c;const c2=$('#qc');if(c2)c2.value=q.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));list()})
const c1=$('#qc');if(c1)c1.onchange=()=>{q.cat=c1.value;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.c===q.cat));list()}}
function list(){const el=$('#list');if(!el)return;const t=q.s.toLowerCase();
if(view==='shops'){let a=db.shops.filter(s=>(!q.cat||s.cat==q.cat)&&(!q.ward||s.ward==q.ward)&&(!t||[s.name,s.owner,s.addr,s.desc,...db.products.filter(p=>p.shopId==s.id).map(p=>p.name)].join(' ').toLowerCase().includes(t)));
a.sort((x,y)=>q.sort=='name'?x.name.localeCompare(y.name,'vi'):y.rating-x.rating);
el.innerHTML=a.length?a.map(s=>`<div class="card click" onclick="detail('${s.id}')"><div class="ava">${CATS[s.cat]||'📦'}</div><h3>${esc(s.name)}</h3>
${s.rating>0?`<div><span class="tag">⭐ ${esc(s.rating)}</span></div>`:''}<div class="mu cl2">🏷️ ${esc(s.cat||'Chưa phân loại')}</div>${s.owner?`<div class="mu">👤 ${esc(s.owner)}</div>`:''}<div class="mu">📍 ${esc(adr(s))}</div>${s.hours?`<div class="mu">🕒 ${esc(s.hours)}</div>`:''}
<div class="mu">${db.products.filter(p=>p.shopId==s.id).length} mặt hàng</div>${t?(()=>{const m=db.products.filter(p=>p.shopId==s.id&&p.name.toLowerCase().includes(t));return m.length?`<div class="mu ok">🔎 Có bán: ${m.slice(0,3).map(p=>esc(p.name)).join(', ')}</div>`:''})():''}</div>`).join(''):'<div class="empty">Không tìm thấy hộ kinh doanh phù hợp.</div>'}
else{let a=db.products.filter(p=>(!q.cat||p.cat==q.cat)&&(!t||[p.name,p.desc,shop(p.shopId)?.name].join(' ').toLowerCase().includes(t)));
a.sort((x,y)=>q.sort=='pa'?x.price-y.price:q.sort=='pd'?y.price-x.price:x.name.localeCompare(y.name,'vi'));
el.innerHTML=a.length?a.map(p=>{const s=shop(p.shopId)||{};return `<div class="card click" onclick="pdetail('${p.id}')">${p.img?`<img class="pimg" src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:`<div class="ava">${CATS[p.cat]||'📦'}</div>`}<h3>${esc(p.name)}</h3>
<div class="price">${money(p.price)}<span class="mu"> / ${esc(p.unit)}</span></div><div class="${p.stock>0?'ok':'no'}">${p.stock>0?'Còn hàng ('+p.stock+')':'Hết hàng'}</div>
${p.desc?`<div class="pd">${esc(p.desc)}</div>`:''}<div class="mu">🏪 <a href="#" onclick="event.stopPropagation();detail('${s.id}');return false" style="color:inherit">${esc(s.name)}</a></div>
${s.phone?`<div class="row" onclick="event.stopPropagation()"><a class="btn sm g" href="tel:${esc(s.phone)}">📞 Gọi</a><a class="btn sm zalo" target="_blank" rel="noopener" href="${zUrl(s)}">💬 Zalo</a></div>`:''}</div>`}).join(''):'<div class="empty">Không tìm thấy mặt hàng phù hợp.</div>'}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));const A=$('#app');
if(view==='manage'){if(!isAdmin()){view='shops';return render()}return manage(A)}if(view==='news')return newsView(A);if(view==='dash')return dash(A);

function compress(file,max=640,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let d=c.toDataURL('image/jpeg',q);if(d.length>150000)d=c.toDataURL('image/jpeg',.5);res(d)};im.src=r.result};r.readAsDataURL(file)})}
