<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhân dân mua sắm</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1b2a22;--mu:#64746b;--bd:#e3e8e2;--pr:#c8102e;--pr2:#a30c24;--ac:#0f7a4d;--sf:#fdf0d5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1a2420;--tx:#eaf1ec;--mu:#9bb0a4;--bd:#2a3832;--pr:#ef4a62;--pr2:#d93550;--ac:#3ecf8e;--sf:#2b2618}}
:root[data-theme="dark"]{--bg:#111815;--card:#1a2420;--tx:#eaf1ec;--mu:#9bb0a4;--bd:#2a3832;--pr:#ef4a62;--pr2:#d93550;--ac:#3ecf8e;--sf:#2b2618}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pr);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}.logo small{display:block;font-weight:400;font-size:11px;opacity:.85}
nav{display:flex;gap:4px;margin-left:auto}nav button{background:transparent;border:0;color:#fff;padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;opacity:.85}
nav button.on{background:rgba(255,255,255,.2);opacity:1}
main{max-width:1100px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:20px;padding:28px 22px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:clamp(22px,4vw,32px)}.hero p{margin:0 0 16px;opacity:.9}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 16px}.stat b{font-size:22px;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%}
.bar input{flex:2 1 220px;width:auto}.bar select{flex:1 1 150px;width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 13px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.card.click{cursor:pointer}.card.click:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.ava{width:48px;height:48px;border-radius:14px;background:var(--sf);display:grid;place-items:center;font-size:26px}
.card h3{margin:2px 0 0;font-size:16px}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--sf);border-radius:8px;padding:2px 8px;font-size:12px;margin-right:4px}
.price{color:var(--pr);font-weight:800;font-size:17px}.ok{color:var(--ac)}.no{color:var(--pr)}
.btn{border:0;background:var(--pr);color:#fff;padding:9px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.g{background:var(--ac)}.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dialog{border:0;border-radius:18px;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--tx);padding:20px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:13px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:18px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.empty{text-align:center;color:var(--mu);padding:40px}h2{margin:18px 0 10px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px}
</style></head><body>
<header><div class="logo">🛍️<div>Nhân dân mua sắm<small>Kết nối hộ kinh doanh với người tiêu dùng</small></div></div>
<nav><button data-v="shops" class="on">Hộ kinh doanh</button><button data-v="products">Mặt hàng</button><button data-v="manage">Quản lý dữ liệu</button></nav></header>
<main id="app"></main>
<footer>Nhân dân mua sắm · Ưu tiên hàng Việt, ủng hộ hộ kinh doanh địa phương</footer>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('vi-VN').format(+n||0)+'đ';
const CATS={'Thực phẩm':'🍚','Rau củ quả':'🥬','Đồ uống':'🧋','Thời trang':'👕','Gia dụng':'🏠','Điện tử':'📱','Mỹ phẩm':'💄','Thủ công mỹ nghệ':'🎎','Khác':'📦'};
const KEY='ndms_v1';
const seed=()=>({shops:[
{id:'s1',name:'Tạp hóa Bà Lan',owner:'Nguyễn Thị Lan',cat:'Thực phẩm',ward:'Phường 1',addr:'12 Lê Lợi',phone:'0901234567',hours:'6:00 - 21:00',mst:'8123456789-001',rating:4.8,desc:'Tạp hóa gia đình hơn 20 năm, hàng chính hãng, giao tận nhà trong bán kính 3km.'},
{id:'s2',name:'Rau sạch Ông Tư',owner:'Trần Văn Tư',cat:'Rau củ quả',ward:'Phường 2',addr:'45 Nguyễn Huệ',phone:'0912345678',hours:'5:00 - 12:00',mst:'8234567890-002',rating:4.9,desc:'Rau củ trồng tại vườn nhà, không thuốc trừ sâu, thu hoạch trong ngày.'},
{id:'s3',name:'Thời trang Hoa Mai',owner:'Lê Thị Mai',cat:'Thời trang',ward:'Phường 3',addr:'88 Trần Phú',phone:'0933456789',hours:'8:00 - 20:30',mst:'8345678901-003',rating:4.5,desc:'Quần áo nam nữ, đồng phục, nhận may đo theo yêu cầu.'},
{id:'s4',name:'Điện máy Minh Khang',owner:'Phạm Minh Khang',cat:'Điện tử',ward:'Phường 1',addr:'230 Hùng Vương',phone:'0944567890',hours:'7:30 - 20:00',mst:'8456789012-004',rating:4.6,desc:'Điện thoại, phụ kiện, thiết bị gia dụng thông minh. Bảo hành tại cửa hàng.'},
{id:'s5',name:'Trà sữa & Cà phê Nắng',owner:'Võ Thị Nắng',cat:'Đồ uống',ward:'Phường 4',addr:'5 Phan Chu Trinh',phone:'0955678901',hours:'7:00 - 22:00',mst:'8567890123-005',rating:4.7,desc:'Cà phê rang xay nguyên chất, trà trái cây, trà sữa pha tươi mỗi ngày.'},
{id:'s6',name:'Gốm Nghề Xưa',owner:'Đặng Văn Hòa',cat:'Thủ công mỹ nghệ',ward:'Phường 2',addr:'19 Ngô Quyền',phone:'0966789012',hours:'8:00 - 18:00',mst:'8678901234-006',rating:4.9,desc:'Gốm thủ công, quà tặng đặc sản địa phương, nhận đặt theo yêu cầu.'}],
products:[
{id:'p1',shopId:'s1',name:'Gạo ST25 túi 5kg',cat:'Thực phẩm',price:145000,unit:'túi',stock:40,desc:'Gạo thơm đặc sản, dẻo mềm.'},
{id:'p2',shopId:'s1',name:'Nước mắm cá cơm 500ml',cat:'Thực phẩm',price:62000,unit:'chai',stock:25,desc:'Độ đạm 40N.'},
{id:'p3',shopId:'s1',name:'Dầu ăn Neptune 1L',cat:'Thực phẩm',price:52000,unit:'chai',stock:0,desc:''},
{id:'p4',shopId:'s2',name:'Rau muống sạch',cat:'Rau củ quả',price:12000,unit:'bó',stock:60,desc:'Hái trong ngày.'},
{id:'p5',shopId:'s2',name:'Cà chua bi',cat:'Rau củ quả',price:35000,unit:'kg',stock:30,desc:''},
{id:'p6',shopId:'s2',name:'Xoài cát chín cây',cat:'Rau củ quả',price:48000,unit:'kg',stock:20,desc:'Ngọt thơm, ít xơ.'},
{id:'p7',shopId:'s3',name:'Áo thun cotton nam',cat:'Thời trang',price:120000,unit:'cái',stock:50,desc:'Vải cotton 100%.'},
{id:'p8',shopId:'s3',name:'Đầm hoa nhí',cat:'Thời trang',price:260000,unit:'cái',stock:15,desc:''},
{id:'p9',shopId:'s4',name:'Sạc nhanh 20W',cat:'Điện tử',price:180000,unit:'cái',stock:35,desc:'Bảo hành 12 tháng.'},
{id:'p10',shopId:'s4',name:'Nồi chiên không dầu 5L',cat:'Gia dụng',price:1290000,unit:'cái',stock:8,desc:''},
{id:'p11',shopId:'s5',name:'Cà phê rang xay 500g',cat:'Đồ uống',price:110000,unit:'gói',stock:45,desc:'Robusta + Arabica.'},
{id:'p12',shopId:'s5',name:'Trà đào cam sả',cat:'Đồ uống',price:32000,unit:'ly',stock:99,desc:''},
{id:'p13',shopId:'s6',name:'Bình hoa gốm men rạn',cat:'Thủ công mỹ nghệ',price:350000,unit:'cái',stock:6,desc:'Làm thủ công.'},
{id:'p14',shopId:'s6',name:'Bộ ấm trà gốm',cat:'Thủ công mỹ nghệ',price:520000,unit:'bộ',stock:4,desc:''}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!db.shops)db=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let view='shops',q={s:'',cat:'',ward:'',sort:'rating'};
const shop=id=>db.shops.find(s=>s.id==id);
const wards=()=>[...new Set(db.shops.map(s=>s.ward).filter(Boolean))].sort();
const toast=m=>{const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2a22;color:#fff;padding:10px 18px;border-radius:12px;z-index:99';document.body.appendChild(t);setTimeout(()=>t.remove(),2500)};
const ask=(m,fn)=>{const d=$('#dlg');d.innerHTML=`<p>${esc(m)}</p><div class="row"><button class="btn" id="yes">Đồng ý</button><button class="btn s" onclick="dlg.close()">Hủy</button></div>`;d.showModal();$('#yes').onclick=()=>{d.close();fn()}};
function bar(kind){return `<div class="bar"><input id="qs" placeholder="🔍 Tìm ${kind==='shops'?'hộ kinh doanh, chủ hộ, địa chỉ':'mặt hàng, cửa hàng'}..." value="${esc(q.s)}">
${kind==='shops'?`<select id="qw"><option value="">Tất cả khu vực</option>${wards().map(w=>`<option ${q.ward==w?'selected':''}>${esc(w)}</option>`).join('')}</select>`:''}
<select id="qo">${kind==='shops'?`<option value="rating">Đánh giá cao</option><option value="name">Tên A-Z</option>`:`<option value="name">Tên A-Z</option><option value="pa">Giá tăng dần</option><option value="pd">Giá giảm dần</option>`}</select></div>
<div class="chips"><button class="chip ${!q.cat?'on':''}" data-c="">Tất cả</button>${Object.keys(CATS).map(c=>`<button class="chip ${q.cat==c?'on':''}" data-c="${c}">${CATS[c]} ${c}</button>`).join('')}</div>`}
function bind(){const i=$('#qs');if(i){i.oninput=()=>{q.s=i.value;list()};}
const w=$('#qw');if(w)w.onchange=()=>{q.ward=w.value;list()};
const o=$('#qo');if(o){o.value=q.sort;o.onchange=()=>{q.sort=o.value;list()}}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{q.cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));list()})}
function list(){const el=$('#list');if(!el)return;const t=q.s.toLowerCase();
if(view==='shops'){let a=db.shops.filter(s=>(!q.cat||s.cat==q.cat)&&(!q.ward||s.ward==q.ward)&&(!t||[s.name,s.owner,s.addr,s.desc].join(' ').toLowerCase().includes(t)));
a.sort((x,y)=>q.sort=='name'?x.name.localeCompare(y.name,'vi'):y.rating-x.rating);
el.innerHTML=a.length?a.map(s=>`<div class="card click" onclick="detail('${s.id}')"><div class="ava">${CATS[s.cat]||'📦'}</div><h3>${esc(s.name)}</h3>
<div><span class="tag">${esc(s.cat)}</span><span class="tag">⭐ ${esc(s.rating)}</span></div><div class="mu">👤 ${esc(s.owner)}</div><div class="mu">📍 ${esc(s.addr)}, ${esc(s.ward)}</div><div class="mu">🕒 ${esc(s.hours)}</div>
<div class="mu">${db.products.filter(p=>p.shopId==s.id).length} mặt hàng</div></div>`).join(''):'<div class="empty">Không tìm thấy hộ kinh doanh phù hợp.</div>'}
else{let a=db.products.filter(p=>(!q.cat||p.cat==q.cat)&&(!t||[p.name,p.desc,shop(p.shopId)?.name].join(' ').toLowerCase().includes(t)));
a.sort((x,y)=>q.sort=='pa'?x.price-y.price:q.sort=='pd'?y.price-x.price:x.name.localeCompare(y.name,'vi'));
el.innerHTML=a.length?a.map(p=>{const s=shop(p.shopId)||{};return `<div class="card"><div class="ava">${CATS[p.cat]||'📦'}</div><h3>${esc(p.name)}</h3>
<div class="price">${money(p.price)}<span class="mu"> / ${esc(p.unit)}</span></div><div class="${p.stock>0?'ok':'no'}">${p.stock>0?'Còn hàng ('+p.stock+')':'Hết hàng'}</div>
<div class="mu">${esc(p.desc)}</div><div class="mu">🏪 <a href="#" onclick="detail('${s.id}');return false" style="color:inherit">${esc(s.name)}</a></div>
${s.phone?`<div class="row"><a class="btn sm g" href="tel:${esc(s.phone)}">📞 Gọi</a><a class="btn sm s" target="_blank" href="https://zalo.me/${esc(s.phone)}">Zalo</a></div>`:''}</div>`}).join(''):'<div class="empty">Không tìm thấy mặt hàng phù hợp.</div>'}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));const A=$('#app');
if(view==='manage')return manage(A);
const hero=view==='shops'?`<div class="hero"><h1>Nhân dân mua sắm</h1><p>Khám phá hộ kinh doanh và hàng hóa quanh bạn, mua trực tiếp, giá minh bạch.</p>
<div class="stats"><div class="stat"><b>${db.shops.length}</b>Hộ kinh doanh</div><div class="stat"><b>${db.products.length}</b>Mặt hàng</div><div class="stat"><b>${new Set(db.shops.map(s=>s.cat)).size}</b>Ngành hàng</div></div></div>`:'';
A.innerHTML=hero+bar(view)+'<div class="grid" id="list"></div>';bind();list()}
function detail(id){const s=shop(id);if(!s)return;const ps=db.products.filter(p=>p.shopId==id);
$('#dlg').innerHTML=`<div class="row" style="justify-content:space-between"><div class="ava">${CATS[s.cat]||'📦'}</div><button class="btn s sm" onclick="dlg.close()">✕ Đóng</button></div>
<h2 style="margin:8px 0">${esc(s.name)}</h2><div><span class="tag">${esc(s.cat)}</span><span class="tag">⭐ ${esc(s.rating)}</span></div>
<p>${esc(s.desc)}</p><div class="mu">👤 Chủ hộ: ${esc(s.owner)}<br>📍 ${esc(s.addr)}, ${esc(s.ward)}<br>🕒 ${esc(s.hours)}<br>🧾 MST/ĐKKD: ${esc(s.mst||'Đang cập nhật')}</div>
<div class="row" style="margin:12px 0"><a class="btn g" href="tel:${esc(s.phone)}">📞 ${esc(s.phone)}</a><a class="btn s" target="_blank" href="https://zalo.me/${esc(s.phone)}">Chat Zalo</a><a class="btn s" target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(s.addr+' '+s.ward)}">Bản đồ</a></div>
<b>Mặt hàng (${ps.length})</b>${ps.map(p=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:8px 0"><span>${esc(p.name)}<br><small class="${p.stock>0?'ok':'no'}">${p.stock>0?'Còn hàng':'Hết hàng'}</small></span><span class="price">${money(p.price)}/${esc(p.unit)}</span></div>`).join('')||'<div class="mu">Chưa có mặt hàng.</div>'}`;
$('#dlg').showModal()}
function manage(A){A.innerHTML=`<h2>Quản lý dữ liệu</h2><div class="row"><button class="btn" onclick="openForm('shop')">+ Hộ kinh doanh</button><button class="btn" onclick="openForm('product')">+ Mặt hàng</button>
<button class="btn s" onclick="exp()">⬇ Xuất JSON</button><button class="btn s" onclick="csv()">⬇ Xuất CSV mặt hàng</button><label class="btn s">⬆ Nhập JSON<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="btn s" onclick="ask('Khôi phục dữ liệu mẫu? Dữ liệu hiện tại sẽ mất.',()=>{db=seed();save();render()})">Khôi phục mẫu</button></div>
<h2>Hộ kinh doanh (${db.shops.length})</h2><div class="tw"><table><tr><th>Tên</th><th>Chủ hộ</th><th>Ngành</th><th>Khu vực</th><th>SĐT</th><th></th></tr>
${db.shops.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.owner)}</td><td>${esc(s.cat)}</td><td>${esc(s.ward)}</td><td>${esc(s.phone)}</td><td><button class="btn s sm" onclick="openForm('shop','${s.id}')">Sửa</button> <button class="btn s sm" onclick="del('shops','${s.id}')">Xóa</button></td></tr>`).join('')}</table></div>
<h2>Mặt hàng (${db.products.length})</h2><div class="tw"><table><tr><th>Tên</th><th>Cửa hàng</th><th>Giá</th><th>Tồn</th><th></th></tr>
${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(shop(p.shopId)?.name||'-')}</td><td>${money(p.price)}/${esc(p.unit)}</td><td>${esc(p.stock)}</td><td><button class="btn s sm" onclick="openForm('product','${p.id}')">Sửa</button> <button class="btn s sm" onclick="del('products','${p.id}')">Xóa</button></td></tr>`).join('')}</table></div>
<div class="mu">Dữ liệu được lưu trên trình duyệt của bạn. Dùng "Xuất JSON" để sao lưu.</div>`}
const opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
function openForm(type,id){const isS=type==='shop';const d=(isS?db.shops:db.products).find(x=>x.id==id)||{};const C=Object.keys(CATS);
const F=isS?[['name','Tên hộ kinh doanh','w'],['owner','Chủ hộ'],['phone','Số điện thoại'],['cat','Ngành hàng','sel'],['ward','Khu vực (phường/xã)'],['addr','Địa chỉ','w'],['hours','Giờ mở cửa'],['mst','MST/Số ĐKKD'],['rating','Đánh giá (1-5)','n'],['desc','Giới thiệu','t']]
:[['name','Tên mặt hàng','w'],['shopId','Hộ kinh doanh','shop'],['cat','Nhóm hàng','sel'],['price','Giá (đ)','n'],['unit','Đơn vị'],['stock','Tồn kho','n'],['desc','Mô tả','t']];
$('#dlg').innerHTML=`<h2 style="margin-top:0">${id?'Sửa':'Thêm'} ${isS?'hộ kinh doanh':'mặt hàng'}</h2><div class="f">${F.map(([k,l,t])=>{const v=d[k]??'';const w=(t=='w'||t=='t')?'w':'';
return `<div class="${w}"><label>${l}</label>${t=='sel'?`<select name="${k}">${opt(C,v)}</select>`:t=='shop'?`<select name="${k}">${db.shops.map(s=>`<option value="${s.id}" ${s.id==v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:t=='t'?`<textarea name="${k}" rows="3">${esc(v)}</textarea>`:`<input name="${k}" type="${t=='n'?'number':'text'}" step="any" value="${esc(v)}">`}</div>`}).join('')}</div>
<div class="row" style="margin-top:14px"><button class="btn" id="sv">Lưu</button><button class="btn s" onclick="dlg.close()">Hủy</button></div>`;
$('#sv').onclick=()=>{const o={...d};$('#dlg').querySelectorAll('[name]').forEach(e=>o[e.name]=e.type=='number'?+e.value:e.value.trim());
if(!o.name)return toast('Vui lòng nhập tên.');if(isS&&!o.phone)return toast('Vui lòng nhập số điện thoại.');if(!isS&&!db.shops.length)return toast('Hãy thêm hộ kinh doanh trước.');
if(isS&&o.rating==null)o.rating=5;if(isS&&!(o.rating>=1&&o.rating<=5))o.rating=5;
const arr=isS?db.shops:db.products;if(d.id)arr[arr.findIndex(x=>x.id==d.id)]=o;else{o.id=uid(isS?'s':'p');arr.push(o)}save();dlg.close();render()};$('#dlg').showModal()}
function del(k,id){ask('Xóa mục này?',()=>{db[k]=db[k].filter(x=>x.id!=id);if(k=='shops')db.products=db.products.filter(p=>p.shopId!=id);save();render()})}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function exp(){dl('nhan-dan-mua-sam.json',JSON.stringify(db,null,1),'application/json')}
function csv(){const r=[['Tên','Cửa hàng','Nhóm','Giá','Đơn vị','Tồn','Mô tả'],...db.products.map(p=>[p.name,shop(p.shopId)?.name,p.cat,p.price,p.unit,p.stock,p.desc])];
dl('mat-hang.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.shops)||!Array.isArray(j.products))throw 0;db=j;save();render()}catch(e){toast('File JSON không hợp lệ.')}})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;q.cat='';q.s='';q.ward='';q.sort=view=='shops'?'rating':'name';render();scrollTo(0,0)});
const dlg=$('#dlg');render();
</script></body></html>
